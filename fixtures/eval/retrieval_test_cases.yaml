# Retrieval Test Cases for research-kb
#
# Each test case specifies:
# - query: The search query
# - expected_source_id: UUID of expected source (preferred, deterministic)
# - expected_source_pattern: Regex fallback for source title matching
# - expected_in_top_k: Result should be in top K results
# - expected_page_range: Optional page range for verification
# - relevance_grade: 0=irrelevant, 1=related, 2=relevant, 3=exact
# - domain: Explicit domain for per-domain breakdown
# - difficulty: easy|medium|hard for per-difficulty breakdown
# - tags: Categories for filtering
#
# Ground truth upgraded 2026-03-30: explicit source UUIDs for 106/107 cases
#


schema_version: 1
audit_date: '2026-05-05'
auditor: assistant_pre_review
pool_source: fixtures/eval/v2_pool_prelabeled.yaml
stratification:
  grade_3_per_domain: 5
  grade_0_per_domain: 5
  domains:
    - mathematics
    - analysis
    - causal_inference
    - machine_learning
    - software_engineering
    - cross_domain
total_samples: 60
random_seed: 42

summary:
  grade_3:
    correct: 25
    borderline: 5
    wrong: 0
    hit_rate_strict: 0.833
    hit_rate_lenient: 1.000  # borderline counted as not-wrong
  grade_0:
    correct: 11
    borderline: 3
    wrong: 16
    hit_rate_strict: 0.367
    hit_rate_lenient: 0.467

verdict: REJECT_AUTO_GRADES
decision_rule_threshold: 0.80
result: >
  Grade-3 labels pass the 80% trust threshold (83% strict / 100% lenient).
  Grade-0 labels FAIL severely (37% strict / 47% lenient). The auto-grader's
  similarity-threshold heuristic is producing a high false-negative rate for
  grade-0 — many genuinely-relevant chunks are mislabeled as irrelevant.
  Auto-grades are NOT trustworthy as a v0 baseline metric; eval results
  computed against them will systematically under-estimate true retrieval
  precision (relevant retrievals graded as misses).

failure_modes:
  - mode: in_domain_content_below_similarity_threshold
    description: >
      Specialized in-domain chunks fall below the suggested_grade=3 threshold
      (~0.45 similarity) and get graded 0 even though they answer the query.
      Examples: Spirtes Causation/Prediction/Search "Directed Acyclic Graphs"
      section graded 0 for "directed acyclic graph causal"; Reed-Simon
      spectral theorem graded 0 for "Banach space functional analysis";
      LightGBM content graded 0 for "gradient boosting XGBoost".
    impact: ~50% of grade-0 samples in math/analysis/CI/ML/SWE were actually relevant
  - mode: vocabulary_mismatch_overweighted
    description: >
      Auto-grader uses BGE cosine similarity, which under-credits chunks with
      different surface vocabulary even when they're conceptually identical
      (e.g., "compact operators" vs "Banach space functional analysis operator"
      — both functional analysis but lexically distinct).
    impact: false-negative concentration in foundational math/analysis domains
  - mode: duplicate_books_inflate_grade_3_count
    description: >
      Multiple MEAP versions of the same book (Ensemble Methods v3/v4/v6/v7)
      surface the same chunk text, all graded 3. Inflates apparent agreement
      rate but under-tests label quality on diverse content.
    impact: 5/5 grade-3 samples for ML are the same XGBoost section across MEAP versions
  - mode: cross_domain_term_collisions
    description: >
      "Dirichlet" matches both Dirichlet's theorem (analytic number theory)
      and Dirichlet distribution (probability). Auto-grader correctly grades
      probability examples as 0 for the number theory query; this is a
      success case for the threshold but illustrates that surface-level
      similarity is sometimes the right signal.
    impact: 3/5 grade-0 samples in math correctly classified due to term-collision filtering

recommendations:
  - "Don't use auto-graded labels as a trustworthy baseline. The eval numbers computed against them will be pessimistic relative to true retrieval quality."
  - "For Session +2 marker-extension decision, use the DELTA between markers-on and markers-off rather than the absolute NDCG/MRR. The auto-grade noise is constant across both runs and cancels out in the A/B comparison."
  - "For a trustworthy baseline, re-grade the existing pool's grade-0 candidates with a tighter rule (e.g., human review for chunks with similarity ≥ 0.65 AND source domain matches query domain). Estimated cost is ~500 candidates × 30 sec each = ~4 hours of human review."
  - "Alternatively, switch the eval scoring rule from auto-grades to a 'match-by-source' criterion — a chunk is relevant if its source has been pre-tagged as a domain-canonical text for the query topic. This trades chunk-level precision for source-level robustness."

